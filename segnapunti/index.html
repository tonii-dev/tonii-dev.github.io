<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToniiScore — Segnapunti Torneo Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --surface: #15151c;
  --surface-2: #1f1f28;
  --surface-3: #2a2a36;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --text: #f5f5f7;
  --text-dim: #8a8a96;
  --text-mute: #5a5a66;
  --accent: #00ff88;
  --home: #ff4757;
  --away: #feca57;
  --yellow: #ffd700;
  --red: #ff3838;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }

body {
  background:
    radial-gradient(circle at 20% 0%, rgba(255,71,87,0.08), transparent 50%),
    radial-gradient(circle at 80% 100%, rgba(254,202,87,0.06), transparent 50%),
    var(--bg);
  min-height: 100vh;
}

#app { min-height: 100vh; }

/* ===== LANDING ===== */
.landing { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.landing-logo {
  font-family: 'Oswald', sans-serif;
  font-size: clamp(48px, 10vw, 96px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; margin-bottom: 16px;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.landing-tagline { color: var(--text-dim); font-size: clamp(14px, 2vw, 18px); margin-bottom: 48px; max-width: 560px; line-height: 1.6; }
.landing-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; max-width: 800px; width: 100%; }
.landing-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px; cursor: pointer; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); text-align: left; position: relative; overflow: hidden; }
.landing-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--card-color, var(--accent)) 0%, transparent 60%); opacity: 0.08; transition: opacity 0.3s; }
.landing-card:hover { transform: translateY(-4px); border-color: var(--card-color, var(--accent)); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.landing-card:hover::before { opacity: 0.18; }
.landing-card-icon { width: 56px; height: 56px; border-radius: 14px; background: var(--card-color, var(--accent)); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; position: relative; z-index: 1; }
.landing-card-icon svg { width: 28px; height: 28px; fill: var(--bg); }
.landing-card-title { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 600; margin-bottom: 8px; position: relative; z-index: 1; }
.landing-card-desc { color: var(--text-dim); font-size: 14px; line-height: 1.6; position: relative; z-index: 1; }
.landing-footer { margin-top: 48px; color: var(--text-mute); font-size: 12px; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ===== BACK BUTTON ===== */
.back-btn { position: fixed; top: 20px; left: 20px; z-index: 100; background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 44px; height: 44px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.back-btn:hover { background: var(--surface-2); border-color: var(--border-strong); transform: translateX(-2px); }
.back-btn svg { width: 20px; height: 20px; fill: currentColor; }

/* ===== PROJECTOR ===== */
.projector { min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.projector::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%); pointer-events: none; }
.projector-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 40px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); position: relative; z-index: 2; gap: 16px; }
.projector-tournament { font-family: 'Oswald', sans-serif; font-size: clamp(14px, 2vw, 20px); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); }
.projector-tournament strong { color: var(--accent); font-weight: 700; }
.projector-phase { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: 20px; white-space: nowrap; }
.live-indicator { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255,71,87,0.15); border: 1px solid rgba(255,71,87,0.3); border-radius: 20px; font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--home); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--home); animation: pulse 1.5s infinite; }

.projector-main { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; gap: 40px; align-items: center; padding: 40px; position: relative; z-index: 2; }
.team-block { display: flex; flex-direction: column; gap: 20px; position: relative; }
.team-block.home { align-items: flex-end; text-align: right; }
.team-block.away { align-items: flex-start; text-align: left; }
.team-color-bar { width: 80px; height: 6px; border-radius: 3px; }
.team-block.home .team-color-bar { background: var(--home); box-shadow: 0 0 20px var(--home); }
.team-block.away .team-color-bar { background: var(--away); box-shadow: 0 0 20px var(--away); }
.team-name { font-family: 'Oswald', sans-serif; font-size: clamp(28px, 5vw, 72px); font-weight: 700; line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); max-width: 100%; word-wrap: break-word; }
.team-block.home .team-name { background: linear-gradient(135deg, #fff 0%, var(--home) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.team-block.away .team-name { background: linear-gradient(135deg, #fff 0%, var(--away) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.team-score { font-family: 'Oswald', sans-serif; font-size: clamp(100px, 18vw, 240px); font-weight: 700; line-height: 0.85; letter-spacing: -0.04em; transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
.team-block.home .team-score { color: var(--home); text-shadow: 0 0 60px rgba(255,71,87,0.4); }
.team-block.away .team-score { color: var(--away); text-shadow: 0 0 60px rgba(254,202,87,0.4); }

.score-center { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.score-divider { font-family: 'Oswald', sans-serif; font-size: clamp(50px, 8vw, 120px); font-weight: 300; color: var(--text-mute); line-height: 1; }
.clock-display { font-family: 'Oswald', sans-serif; font-size: clamp(32px, 5vw, 60px); font-weight: 600; letter-spacing: 0.02em; color: var(--accent); text-shadow: 0 0 30px rgba(0,255,136,0.4); font-variant-numeric: tabular-nums; padding: 8px 22px; background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.2); border-radius: 12px; }
.clock-display.paused { color: var(--text-mute); background: rgba(255,255,255,0.04); border-color: var(--border); text-shadow: none; }

.projector-events { padding: 20px 40px 32px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border-top: 1px solid var(--border); position: relative; z-index: 2; }
.events-label { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 14px; }
.events-list { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.events-list::-webkit-scrollbar { display: none; }
.event-chip { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; white-space: nowrap; animation: slideIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); flex-shrink: 0; }
@keyframes slideIn { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
.event-chip.home { border-color: rgba(255,71,87,0.3); background: linear-gradient(135deg, rgba(255,71,87,0.12), var(--surface)); }
.event-chip.away { border-color: rgba(254,202,87,0.3); background: linear-gradient(135deg, rgba(254,202,87,0.12), var(--surface)); }
.event-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Oswald', sans-serif; }
.event-icon.goal { background: var(--accent); color: var(--bg); }
.event-icon.yellow { background: var(--yellow); color: var(--bg); }
.event-icon.red { background: var(--red); color: #fff; }
.event-minute { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; color: var(--text); }
.event-player { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.events-empty { color: var(--text-mute); font-size: 14px; padding: 8px 0; font-style: italic; }

/* Celebration */
.celebration { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: 0; }
.celebration.active { animation: celebrate 1.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes celebrate { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
.celebration::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, var(--celebration-color, var(--accent)) 0%, transparent 70%); opacity: 0.35; }
.celebration-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.3); font-family: 'Oswald', sans-serif; font-size: clamp(80px, 18vw, 220px); font-weight: 700; color: var(--celebration-color, var(--accent)); text-shadow: 0 0 80px var(--celebration-color, var(--accent)); letter-spacing: -0.02em; text-transform: uppercase; opacity: 0; }
.celebration.active .celebration-text { animation: textPop 1.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes textPop { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
.team-score.bump { animation: scoreBump 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes scoreBump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* ===== CONTROL ===== */
.control { min-height: 100vh; padding: 80px 24px 40px; max-width: 900px; margin: 0 auto; }
.control-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
.control-title { font-family: 'Oswald', sans-serif; font-size: clamp(28px, 5vw, 44px); font-weight: 700; letter-spacing: -0.01em; }
.control-title span { color: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all 0.2s; text-decoration: none; }
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn-primary:hover { background: #00cc6e; border-color: #00cc6e; }
.btn svg { width: 16px; height: 16px; fill: currentColor; }
.control-grid { display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
.panel-title { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.panel-title::before { content: ''; width: 3px; height: 16px; background: var(--accent); border-radius: 2px; }
.form-row { display: grid; gap: 16px; margin-bottom: 16px; }
.form-row:last-child { margin-bottom: 0; }
.form-row.two { grid-template-columns: 1fr 1fr; }
.form-row.three { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 600px) { .form-row.two, .form-row.three { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; color: var(--text-dim); font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; }
.input, .select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; transition: all 0.2s; outline: none; width: 100%; }
.input:focus, .select:focus { border-color: var(--accent); background: var(--surface-3); box-shadow: 0 0 0 3px rgba(0,255,136,0.1); }
.input::placeholder { color: var(--text-mute); }
.select { cursor: pointer; }

.score-control { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 500px) { .score-control { grid-template-columns: 1fr; } }
.score-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; position: relative; overflow: hidden; }
.score-card.home { border-color: rgba(255,71,87,0.2); }
.score-card.away { border-color: rgba(254,202,87,0.2); }
.score-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.score-card.home::before { background: var(--home); }
.score-card.away::before { background: var(--away); }
.score-card-label { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.score-card-value { font-family: 'Oswald', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; margin-bottom: 16px; font-variant-numeric: tabular-nums; }
.score-card.home .score-card-value { color: var(--home); }
.score-card.away .score-card-value { color: var(--away); }
.score-buttons { display: flex; gap: 8px; }
.score-btn { flex: 1; padding: 10px; background: var(--surface-3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.score-btn:hover { transform: translateY(-1px); }
.score-btn:active { transform: translateY(1px); }
.score-btn.plus { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.3); color: var(--accent); }
.score-btn.plus:hover { background: rgba(0,255,136,0.2); }
.score-btn.minus { background: rgba(255,71,87,0.08); border-color: rgba(255,71,87,0.2); color: var(--home); }
.score-btn.minus:hover { background: rgba(255,71,87,0.15); }

.clock-control { display: flex; flex-direction: column; gap: 16px; }
.clock-display-control { font-family: 'Oswald', sans-serif; font-size: 64px; font-weight: 700; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; padding: 20px; background: var(--surface-2); border-radius: 14px; border: 1px solid var(--border); }
.clock-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 500px) { .clock-buttons { grid-template-columns: repeat(2, 1fr); } }

.events-list-control { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
.event-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; animation: slideIn 0.3s; }
.event-item-info { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.event-item-minute { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; min-width: 40px; }
.event-item-player { color: var(--text-dim); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event-item-team { font-size: 10px; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; margin-left: 8px; flex-shrink: 0; }
.event-item-team.home { background: rgba(255,71,87,0.15); color: var(--home); }
.event-item-team.away { background: rgba(254,202,87,0.15); color: var(--away); }
.event-delete { background: transparent; border: none; color: var(--text-mute); cursor: pointer; padding: 6px 8px; border-radius: 6px; transition: all 0.2s; flex-shrink: 0; }
.event-delete:hover { color: var(--red); background: rgba(255,56,56,0.1); }
.event-delete svg { width: 16px; height: 16px; fill: currentColor; }
.empty-state { text-align: center; padding: 32px; color: var(--text-mute); font-size: 14px; }
.form-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.event-type-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.event-type-tab { padding: 14px 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-dim); }
.event-type-tab:hover { border-color: var(--border-strong); color: var(--text); }
.event-type-tab.active[data-type="goal"] { border-color: var(--accent); color: var(--accent); background: rgba(0,255,136,0.05); }
.event-type-tab.active[data-type="yellow"] { border-color: var(--yellow); color: var(--yellow); background: rgba(255,215,0,0.05); }
.event-type-tab.active[data-type="red"] { border-color: var(--red); color: var(--red); background: rgba(255,56,56,0.05); }
.event-type-icon { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; font-family: 'Oswald', sans-serif; }
.event-type-icon.goal { background: var(--accent); color: var(--bg); }
.event-type-icon.yellow { background: var(--yellow); color: var(--bg); }
.event-type-icon.red { background: var(--red); color: #fff; }

/* Toast */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: toastIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); max-width: 300px; pointer-events: auto; }
.toast.success { border-color: rgba(0,255,136,0.3); }
.toast.warning { border-color: rgba(254,202,87,0.3); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
.toast-icon { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.toast.warning .toast-icon { background: var(--away); }
.toast-text { font-size: 14px; color: var(--text); }

/* Connector status */
.connector-status { position: fixed; bottom: 16px; left: 16px; z-index: 50; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
.connector-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
.connector-status.local .dot { background: var(--away); box-shadow: 0 0 8px var(--away); }

/* Mobile projector */
@media (max-width: 768px) {
  .projector-main { grid-template-columns: 1fr; gap: 16px; padding: 24px 16px; }
  .team-block.home, .team-block.away { align-items: center; text-align: center; }
  .score-center { order: 2; gap: 16px; }
  .projector-header { padding: 16px 20px; flex-wrap: wrap; }
  .projector-events { padding: 16px 20px 24px; }
  .team-score { font-size: clamp(72px, 22vw, 120px); }
  .team-name { font-size: clamp(24px, 6vw, 36px); }
  .back-btn { top: 12px; left: 12px; }
  .control { padding: 70px 16px 30px; }
}
</style>
</head>

  if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();

    // Verifica connessione reale tramite nodo .info/connected
    db.ref('.info/connected').on('value', (snap) => {

} catch(e) {
  console.warn('Firebase non disponibile, uso modalità locale:', e);
  db = null;
  useFirebase = false;
}

/* ===== STORE ===== */
const STORAGE_KEY = 'scorematch_state_v2';

const defaultState = {
  matchInfo: { tournament: 'TORNEO CALCIO', phase: 'Finale' },
  home: { name: 'SQUADRA CASA', score: 0 },
  away: { name: 'SQUADRA OSPITE', score: 0 },
  clock: { running: false, startTime: 0, accumulated: 0 },
  events: [],
  lastGoal: null
};

let currentState = JSON.parse(JSON.stringify(defaultState));
const listeners = [];

function loadState() {
  if (useFirebase) return;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) currentState = { ...JSON.parse(JSON.stringify(defaultState)), ...JSON.parse(raw) };
  } catch(e) {}
}

function saveState() {
  if (useFirebase) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentState)); } catch(e) {}
}

function notifyListeners() {
  listeners.forEach(fn => fn(currentState));
}

function subscribe(fn) {
  listeners.push(fn);
  fn(currentState);
  return () => {
    const i = listeners.indexOf(fn);
    if (i >= 0) listeners.splice(i, 1);
  };
}

// Sincronizzazione tra schede (modalità locale)
window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY && !useFirebase && e.newValue) {
    try {
      currentState = { ...JSON.parse(JSON.stringify(defaultState)), ...JSON.parse(e.newValue) };
      notifyListeners();
    } catch(err) {}
  }
});

// Sottoscrizione Firebase
if (db) {
  db.ref('tournament').on('value', (snap) => {
    const val = snap.val();
    if (val) {
      currentState = { ...JSON.parse(JSON.stringify(defaultState)), ...val };
      // Firebase salva gli eventi con .push() -> arrivano come oggetto {key: event}, non array
      if (!currentState.events || !Array.isArray(currentState.events)) {
        currentState.events = currentState.events
          ? Object.values(currentState.events)
          : [];
      }
      if (!currentState.clock) currentState.clock = { running: false, startTime: 0, accumulated: 0 };
    }
    notifyListeners(); // sempre, anche se val è null
  }, (err) => {
    console.error('Errore lettura Firebase:', err);
    useFirebase = false;
    updateConnectionStatus(false);
    loadState(); // fallback locale
    notifyListeners();
  });
}

loadState();

/* ===== AZIONI ===== */
const actions = {
  setTeamName(team, name) {
    if (useFirebase) db.ref(`tournament/${team}/name`).set(name);
    else { currentState[team].name = name; saveState(); notifyListeners(); }
  },
  setMatchInfo(key, value) {
    if (useFirebase) db.ref(`tournament/matchInfo/${key}`).set(value);
    else { currentState.matchInfo[key] = value; saveState(); notifyListeners(); }
  },
  setScore(team, score) {
    score = Math.max(0, score);
    if (useFirebase) db.ref(`tournament/${team}/score`).set(score);
    else { currentState[team].score = score; saveState(); notifyListeners(); }
  },
  incrementScore(team, delta) {
    const newScore = Math.max(0, (currentState[team]?.score || 0) + delta);
    if (delta > 0) {
      if (useFirebase) db.ref('tournament/lastGoal').set({ team, timestamp: Date.now() });
      else currentState.lastGoal = { team, timestamp: Date.now() };
    }
    this.setScore(team, newScore);
  },
  startClock() {
    const accumulated = Number(currentState.clock?.accumulated) || 0;
    const update = { running: true, startTime: Date.now(), accumulated };
    if (useFirebase) db.ref('tournament/clock').update(update);
    else { currentState.clock = { ...currentState.clock, ...update }; saveState(); notifyListeners(); }
  },
  pauseClock() {
    const c = currentState.clock;
    if (!c.running) return;
    const elapsed = c.accumulated + (Date.now() - c.startTime) / 1000;
    const update = { running: false, startTime: 0, accumulated: elapsed };
    if (useFirebase) db.ref('tournament/clock').update(update);
    else { currentState.clock = { ...currentState.clock, ...update }; saveState(); notifyListeners(); }
  },
  resetClock() {
    const update = { running: false, startTime: 0, accumulated: 0 };
    if (useFirebase) db.ref('tournament/clock').update(update);
    else { currentState.clock = { ...currentState.clock, ...update }; saveState(); notifyListeners(); }
  },
  addClockMinutes(minutes) {
    const c = currentState.clock;
    let newAccumulated = c.accumulated + minutes * 60;
    if (c.running && c.startTime) {
      newAccumulated = c.accumulated + (Date.now() - c.startTime) / 1000 + minutes * 60;
    }
    newAccumulated = Math.max(0, newAccumulated);
    const update = { accumulated: newAccumulated };
    if (useFirebase) db.ref('tournament/clock').update(update);
    else { currentState.clock = { ...currentState.clock, ...update }; saveState(); notifyListeners(); }
  },
  addEvent(event) {
    const newEvent = {
      id: 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      type: event.type, team: event.team, player: event.player || '',
      minute: event.minute || 0, timestamp: Date.now()
    };
    if (useFirebase) {
      db.ref('tournament/events').push(newEvent);
      if (event.type === 'goal') db.ref('tournament/lastGoal').set({ team: event.team, timestamp: Date.now() });
    } else {
      currentState.events = [...(currentState.events || []), newEvent];
      if (event.type === 'goal') currentState.lastGoal = { team: event.team, timestamp: Date.now() };
      saveState(); notifyListeners();
    }
  },
  deleteEvent(id) {
    if (useFirebase) db.ref(`tournament/events/${id}`).remove();
    else { currentState.events = currentState.events.filter(e => e.id !== id); saveState(); notifyListeners(); }
  },
  resetMatch() {
    if (useFirebase) {
      db.ref('tournament').update({
        home: { name: currentState.home.name, score: 0 },
        away: { name: currentState.away.name, score: 0 },
        clock: { running: false, startTime: 0, accumulated: 0 },
        events: {},
        lastGoal: null
      });
    } else {
      currentState.home.score = 0;
      currentState.away.score = 0;
      currentState.clock = { running: false, startTime: 0, accumulated: 0 };
      currentState.events = [];
      currentState.lastGoal = null;
      saveState(); notifyListeners();
    }
  }
};

/* ===== UTILITY ===== */
function formatTime(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function getCurrentClockTime() {
  const c = currentState.clock;
  if (!c) return 0;
  const accumulated = Number(c.accumulated) || 0;
  const startTime = Number(c.startTime) || 0;
  if (c.running && startTime) return accumulated + (Date.now() - startTime) / 1000;
  return accumulated;
}

function showToast(text, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<div class="toast-icon">${type === 'warning' ? '!' : '✓'}</div><div class="toast-text">${text}</div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(40px)';
    toast.style.transition = 'all 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

function updateProjector(state) {
  const homeName = document.getElementById('pptHomeName');
  const awayName = document.getElementById('pptAwayName');
  if (homeName) homeName.textContent = state.home?.name || 'SQUADRA CASA';
  if (awayName) awayName.textContent = state.away?.name || 'SQUADRA OSPITE';
  
  const homeScore = state.home?.score || 0;
  const awayScore = state.away?.score || 0;
  const homeScoreEl = document.getElementById('pptHomeScore');
  const awayScoreEl = document.getElementById('pptAwayScore');
  
  if (homeScoreEl && homeScore !== lastScoreHome) {
    if (!isFirstProjectorUpdate && homeScore > lastScoreHome) {
      triggerCelebration('home');
      homeScoreEl.classList.add('bump');
      setTimeout(() => homeScoreEl.classList.remove('bump'), 700);
    }
    homeScoreEl.textContent = homeScore;
    lastScoreHome = homeScore;
  }
  
  if (awayScoreEl && awayScore !== lastScoreAway) {
    if (!isFirstProjectorUpdate && awayScore > lastScoreAway) {
      triggerCelebration('away');
      awayScoreEl.classList.add('bump');
      setTimeout(() => awayScoreEl.classList.remove('bump'), 700);
    }
    awayScoreEl.textContent = awayScore;
    lastScoreAway = awayScore;
  }
  
  isFirstProjectorUpdate = false;
  
  const tEl = document.getElementById('pptTournament');
  const pEl = document.getElementById('pptPhase');
  if (tEl) tEl.innerHTML = `<strong>${state.matchInfo?.tournament || 'TORNEO'}</strong>`;
  if (pEl) pEl.textContent = state.matchInfo?.phase || '';
  
  const eventsEl = document.getElementById('pptEvents');
  if (eventsEl) {
    const events = (Array.isArray(state.events) ? state.events : Object.values(state.events || {}))
      .slice()
      .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
      .slice(0, 12);
    
    if (events.length === 0) {
      eventsEl.innerHTML = `<div class="events-empty">Nessun evento registrato</div>`;
    } else {
      eventsEl.innerHTML = events.map(e => {
        const iconClass = e.type === 'goal' ? 'goal' : e.type === 'yellow' ? 'yellow' : 'red';
        const iconText = e.type === 'goal' ? 'GOL' : e.type === 'yellow' ? 'G' : 'R';
        const teamClass = e.team;
        const teamName = e.team === 'home' ? (state.home?.name || 'CASA') : (state.away?.name || 'OSPITI');
        const playerText = e.player || teamName;
        return `
          <div class="event-chip ${teamClass}">
            <div class="event-icon ${iconClass}">${iconText}</div>
            <div>
              <div class="event-minute">${e.minute || 0}'</div>
              <div class="event-player">${playerText}</div>
            </div>
          </div>
        `;
      }).join('');
    }
  }
}

function triggerCelebration(team) {
  const celebration = document.getElementById('celebration');
  const text = document.getElementById('celebrationText');
  if (!celebration || !text) return;
  const color = team === 'home' ? '#ff4757' : '#feca57';
  celebration.style.setProperty('--celebration-color', color);
  text.textContent = 'GOL!';
  text.style.color = color;
  text.style.textShadow = `0 0 80px ${color}`;
  celebration.classList.remove('active');
  void celebration.offsetWidth;
  celebration.classList.add('active');
  setTimeout(() => celebration.classList.remove('active'), 1800);
}

    </div>
  `;
  
  document.getElementById('ctrlTournament').value = currentState.matchInfo?.tournament || '';
  document.getElementById('ctrlTournament').addEventListener('input', e => actions.setMatchInfo('tournament', e.target.value));
  
  document.getElementById('ctrlPhase').value = currentState.matchInfo?.phase || '';
  document.getElementById('ctrlPhase').addEventListener('input', e => actions.setMatchInfo('phase', e.target.value));
  
  document.getElementById('ctrlHomeName').value = currentState.home?.name || '';
  document.getElementById('ctrlHomeName').addEventListener('input', e => actions.setTeamName('home', e.target.value));
  
  document.getElementById('ctrlAwayName').value = currentState.away?.name || '';
  document.getElementById('ctrlAwayName').addEventListener('input', e => actions.setTeamName('away', e.target.value));
  
  document.getElementById('ctrlEventMinute').value = Math.floor(getCurrentClockTime() / 60);
  
  controlUnsub = subscribe(updateControl);
}

function updateControl(state) {
  const hs = document.getElementById('ctrlHomeScore');
  const as = document.getElementById('ctrlAwayScore');
  if (hs) hs.textContent = state.home?.score || 0;
  if (as) as.textContent = state.away?.score || 0;
  
  const hl = document.getElementById('ctrlHomeLabel');
  const al = document.getElementById('ctrlAwayLabel');
  if (hl) hl.textContent = state.home?.name || 'Squadra Casa';
  if (al) al.textContent = state.away?.name || 'Squadra Ospiti';
  
  const eth = document.getElementById('ctrlEventTeamHome');
  const eta = document.getElementById('ctrlEventTeamAway');
  if (eth) eth.textContent = state.home?.name || 'Squadra Casa';
  if (eta) eta.textContent = state.away?.name || 'Squadra Ospiti';
  
  const toggleBtn = document.getElementById('ctrlClockToggle');
  if (toggleBtn) toggleBtn.textContent = state.clock?.running ? 'Pausa' : 'Avvia';
  
  const list = document.getElementById('ctrlEventsList');
  if (list) {
    const events = (Array.isArray(state.events) ? state.events : Object.values(state.events || {}))
      .slice()
      .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    
    if (events.length === 0) {
      list.innerHTML = `<div class="empty-state">Nessun evento registrato</div>`;
    } else {
      list.innerHTML = events.map(e => {
        const iconClass = e.type === 'goal' ? 'goal' : e.type === 'yellow' ? 'yellow' : 'red';
        const iconText = e.type === 'goal' ? 'GOL' : e.type === 'yellow' ? 'G' : 'R';
        const teamName = e.team === 'home' ? (state.home?.name || 'Casa') : (state.away?.name || 'Ospiti');
        return `
          <div class="event-item">
            <div class="event-icon ${iconClass}">${iconText}</div>
            <div class="event-item-info">
              <div class="event-item-minute">${e.minute || 0}'</div>
              <div class="event-item-player">${e.player || '—'}<span class="event-item-team ${e.team}">${teamName}</span></div>
            </div>
            <button class="event-delete" onclick="actions.deleteEvent('${e.id}')" title="Elimina">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
          </div>
        `;
      }).join('');
    }
  }
}

function setEventType(type) {
  newEventType = type;
  document.querySelectorAll('.event-type-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.type === type);
  });
}

function toggleClock() {
  if (currentState.clock?.running) actions.pauseClock();
  else actions.startClock();
}

function addEventFromForm() {
  const team = document.getElementById('ctrlEventTeam').value;
  const minute = parseInt(document.getElementById('ctrlEventMinute').value) || 0;
  const player = document.getElementById('ctrlEventPlayer').value.trim();
  
  actions.addEvent({ type: newEventType, team, minute, player });
  
  if (newEventType === 'goal') {
    actions.incrementScore(team, 1);
  }
  
  document.getElementById('ctrlEventPlayer').value = '';
  document.getElementById('ctrlEventMinute').value = Math.floor(getCurrentClockTime() / 60);
  
  const labels = { goal: 'Goal registrato', yellow: 'Cartellino giallo', red: 'Cartellino rosso' };
  showToast(labels[newEventType]);
}

function confirmResetMatch() {
  // Usa un pannello di conferma personalizzato invece di confirm()
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast warning';
  toast.style.flexDirection = 'column';
  toast.style.alignItems = 'stretch';
  toast.style.maxWidth = '320px';
  toast.innerHTML = `
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
      <div class="toast-icon" style="background: var(--away);">?</div>
      <div class="toast-text">Reset della partita? Punteggio, cronometro ed eventi verranno azzerati.</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn" style="flex: 1; padding: 8px;" id="cancelReset">Annulla</button>
      <button class="btn btn-primary" style="flex: 1; padding: 8px;" id="confirmReset">Reset</button>
    </div>
  `;
  container.appendChild(toast);
  
  document.getElementById('cancelReset').onclick = () => toast.remove();
  document.getElementById('confirmReset').onclick = () => {
    actions.resetMatch();
    toast.remove();
    showToast('Partita resettata');
  };
}

function openProjector() {
  const url = location.pathname + location.search + '#/projector';
  window.open(url, '_blank');
}

// Clock ticker per il control
setInterval(() => {
  const clockEl = document.getElementById('ctrlClock');
  if (clockEl) clockEl.textContent = formatTime(getCurrentClockTime());
}, 100);

// Inizializzazione
render();
</script>
