<!-- SCENA 7 -->
<div class="sc" data-dur="12000"><svg viewBox="0 0 800 400">
<text class="s big" data-d="0" data-c="Ricapitolando." x="400" y="55" text-anchor="middle">Ricapitolando</text>
<text class="s" data-d="1000" x="50" y="125" style="fill:#f6d365">Osso = compatto + spugnoso, in tutte le ossa</text>
<text class="s" data-d="2600" x="50" y="190" style="fill:#f7a35c">Compatto: osteoni, superficie e diafisi</text>
<text class="s" data-d="4200" x="50" y="255" style="fill:#a8e6a1">Spugnoso: pieno di pori, interno ed epifisi</text>
<text class="s" data-d="5800" x="50" y="320" style="fill:#c9a7f0">Osteoblasti costruiscono, osteociti sono maturi</text>

</svg></div>
</div>
<div id="cap" aria-live="polite"></div>
<div id="ctl"><button id="prev" aria-label="Scena precedente">◀</button><button id="pp" aria-label="Play o pausa">❚❚ Pausa</button><button id="next" aria-label="Scena successiva">▶</button><span id="dots"></span></div>
<script>
const NS='http://www.w3.org/2000/svg',E=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
// osteoni (compatto)
const cmp=document.getElementById('cmp');
for(let r=0;r<2;r++)for(let c=0;c<3;c++){const x=95+c*110,y=95+r*110;[40,24].forEach(R=>E('circle',{cx:x,cy:y,r:R,class:'k',stroke:'#f7a35c','stroke-width':2.5},cmp));E('circle',{cx:x,cy:y,r:8,fill:'#0d1f25'},cmp)}
// spugnoso (trabecole)
const spg=document.getElementById('spg');let seed=7;const rn=()=>(seed=(seed*9301+49297)%233280)/233280;
const P=[];for(let r=0;r<4;r++){P.push([]);for(let c=0;c<5;c++)P[r].push([450+c*70+(rn()-.5)*34,55+r*65+(rn()-.5)*28])}
for(let r=0;r<4;r++)for(let c=0;c<5;c++){const a=P[r][c];if(c<4)E('line',{x1:a[0],y1:a[1],x2:P[r][c+1][0],y2:P[r][c+1][1],class:'k',stroke:'#a8e6a1','stroke-width':3.5},spg);if(r<3)E('line',{x1:a[0],y1:a[1],x2:P[r+1][c][0],y2:P[r+1][c][1],class:'k',stroke:'#a8e6a1','stroke-width':3.5},spg);if(r<3&&c<4)E('line',{x1:a[0],y1:a[1],x2:P[r+1][c+1][0],y2:P[r+1][c+1][1],class:'k',stroke:'#a8e6a1','stroke-width':2},spg)}
// osteociti nell'osteone
const ost=document.getElementById('ost');
[[93,40],[58,150],[128,200],[93,260],[58,330],[128,20],[93,110]].forEach(([R,a])=>{const t=a*Math.PI/180;E('ellipse',{cx:270+R*Math.cos(t),cy:205+R*Math.sin(t),rx:9,ry:5.5,fill:'#c9a7f0',transform:`rotate(${a+90} ${270+R*Math.cos(t)} ${205+R*Math.sin(t)})`},ost)});
// player
const sc=[...document.querySelectorAll('.sc')],cap=document.getElementById('cap'),pp=document.getElementById('pp'),dots=document.getElementById('dots');
let cur=0,playing=true,T=[];
sc.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Scena '+(i+1));b.onclick=()=>{playing=true;show(i)};dots.appendChild(b)});
const clr=()=>{T.forEach(clearTimeout);T=[]};
function label(){pp.textContent=playing?'❚❚ Pausa':'▶ Avvia'}
function show(i){clr();cur=i;sc.forEach((s,k)=>s.classList.toggle('act',k==i));[...dots.children].forEach((d,k)=>d.classList.toggle('act',k==i));
 const s=sc[i];s.querySelectorAll('.s').forEach(e=>e.classList.remove('on'));cap.textContent='';label();
 s.querySelectorAll('.s').forEach(e=>T.push(setTimeout(()=>{e.classList.add('on');if(e.dataset.c)cap.textContent=e.dataset.c},+e.dataset.d||0)));
 if(playing)T.push(setTimeout(()=>{if(i<sc.length-1)show(i+1);else{playing=false;label()}},+s.dataset.dur))}
function finish(){clr();const s=sc[cur];let last='';s.querySelectorAll('.s').forEach(e=>{e.classList.add('on');if(e.dataset.c)last=e.dataset.c});if(last)cap.textContent=last}
pp.onclick=()=>{if(playing){playing=false;finish();label()}else{playing=true;show(cur<sc.length-1?cur+1:0)}};
document.getElementById('prev').onclick=()=>show(Math.max(0,cur-1));
document.getElementById('next').onclick=()=>show(Math.min(sc.length-1,cur+1));
show(0);
</script></body></html>
